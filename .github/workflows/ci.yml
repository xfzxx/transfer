name: ci

# 只做两件事：静态检查不许退化、判据测试必须全绿。
# 不打包（PyInstaller 一轮两分钟且产物无用），不跑 GUI。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 静态检查
        run: ruff check .

      - name: 判据测试
        run: pytest tests -q

      - name: 语法编译（抓 Py2 残留与不可达的缩进错）
        run: python -m compileall -q .
